# Base compose.
#
# Postgres is EXTERNAL — this stack does NOT run it. Set DATABASE_URL in .env to
# your existing instance. In production the app joins your existing `backend`
# Docker network to reach it (docker-compose.prod.yml); in local dev a throwaway
# Postgres container is provided (docker-compose.override.yml).
#
# Redis runs in Docker (Celery broker + result backend) on an internal app
# network. Umami is host-managed. Only the frontend is published (behind nginx).
#
# Networks:
#   • appnet (internal) — redis + Python services. No host/internet route.
#   • web    (bridge)   — outbound (Gemini/OAuth) + nginx→frontend→backend.
#     The frontend is on `web` only, so it cannot reach redis/postgres directly.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set a strong REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    networks: [appnet]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a strong REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env          # provides DATABASE_URL (your external Postgres)
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    networks: [appnet, web]
    volumes:
      - recallai_uploads:/var/recallai/uploads
      - recallai_results:/var/recallai/results
    depends_on:
      redis: { condition: service_healthy }
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"]

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    networks: [appnet, web]
    volumes:
      - recallai_uploads:/var/recallai/uploads
      - recallai_results:/var/recallai/results
    depends_on:
      redis: { condition: service_healthy }
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "pipeline", "-c", "${CELERY_CONCURRENCY:-4}", "--loglevel=info"]

  # Celery Beat — scheduler (workers/celery_app.py): cleanup_expired_jobs +
  # fail_hung_jobs. Only talks to Redis, so it stays on appnet.
  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    networks: [appnet]
    depends_on:
      redis: { condition: service_healthy }
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]

  frontend:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    # On `web` only — cannot reach redis/postgres. Least-privilege env.
    networks: [web]
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL}
    depends_on:
      backend: { condition: service_started }

networks:
  appnet:
    internal: true
  web:
    driver: bridge

volumes:
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECALLAI_DATA_DIR}/redis_data
  recallai_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECALLAI_DATA_DIR}/recallai_uploads
  recallai_results:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECALLAI_DATA_DIR}/recallai_results
