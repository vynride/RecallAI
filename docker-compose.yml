# Base compose.
#
# Network topology:
#   • backend  (internal: true) — postgres, redis, and the Python services. No
#                                 route to the host or internet; not publishable.
#   • web      (bridge)         — outbound access (Gemini API, OAuth) + the path
#                                 nginx -> frontend -> backend. Postgres/Redis are
#                                 NOT on this network, so the frontend can't reach
#                                 them directly.
#
# Only the frontend is exposed (loopback, behind host nginx — see deploy/nginx/).
# Postgres + Redis run in Docker; Umami is host-managed (set NEXT_PUBLIC_UMAMI_*).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recallai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-recallai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recallai} -d ${POSTGRES_DB:-recallai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set a strong REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    networks: [backend]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a strong REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recallai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recallai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    networks: [backend, web]
    volumes:
      - recallai_uploads:/var/recallai/uploads
      - recallai_results:/var/recallai/results
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"]

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recallai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recallai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    networks: [backend, web]
    volumes:
      - recallai_uploads:/var/recallai/uploads
      - recallai_results:/var/recallai/results
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "pipeline", "-c", "${CELERY_CONCURRENCY:-4}", "--loglevel=info"]

  # Celery Beat — scheduler for periodic maintenance (workers/celery_app.py):
  # cleanup_expired_jobs (TTL eviction) + fail_hung_jobs. No outbound access.
  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recallai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recallai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]

  frontend:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    # On `web` only — the frontend cannot reach Postgres/Redis directly.
    # Least privilege: only the vars the Next server needs (no DB secrets).
    networks: [web]
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL}
    depends_on:
      backend: { condition: service_started }

networks:
  backend:
    internal: true
  web:
    driver: bridge

volumes:
  pg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECALLAI_DATA_DIR}/pg_data
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECALLAI_DATA_DIR}/redis_data
  recallai_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECALLAI_DATA_DIR}/recallai_uploads
  recallai_results:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECALLAI_DATA_DIR}/recallai_results
