# Development overrides — applied automatically by `docker compose up`.
#
# Production connects to your EXTERNAL Postgres; local dev instead runs a
# throwaway Postgres container on the internal appnet, and points the app at it.
# Redis comes from the base compose. Umami is host-managed (leave
# NEXT_PUBLIC_UMAMI_* blank to disable locally). Source is bind-mounted for reload.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    networks: [appnet]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recallai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recallai}
      POSTGRES_DB: ${POSTGRES_DB:-recallai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recallai} -d ${POSTGRES_DB:-recallai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    ports:
      - "127.0.0.1:8005:8000"   # local API access for debugging (loopback only)
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recallai}:${POSTGRES_PASSWORD:-recallai}@postgres:5432/${POSTGRES_DB:-recallai}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recallai}:${POSTGRES_PASSWORD:-recallai}@postgres:5432/${POSTGRES_DB:-recallai}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres: { condition: service_healthy }

  beat:
    environment:
      ENVIRONMENT: development
    volumes:
      - ./backend/app:/app/app

  frontend:
    ports:
      - "127.0.0.1:3005:3000"
    build:
      context: ./client
      target: deps
    volumes:
      - ./client/app:/app/app
      - ./client/components:/app/components
      - ./client/lib:/app/lib
      - ./client/public:/app/public
      - ./client/next.config.ts:/app/next.config.ts
      - ./client/tsconfig.json:/app/tsconfig.json
      - ./client/postcss.config.mjs:/app/postcss.config.mjs
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development

volumes:
  pg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECALLAI_DATA_DIR}/pg_data
