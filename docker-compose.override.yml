# Development overrides — applied automatically by `docker compose up`.
#
# Postgres + Redis come from the base compose (same internal `backend` network).
# Umami is host-managed (leave NEXT_PUBLIC_UMAMI_* blank to disable locally).
# Source is bind-mounted so code changes are picked up without rebuilding.

services:
  backend:
    ports:
      - "127.0.0.1:8005:8000"   # local API access for debugging (loopback only)
    environment:
      ENVIRONMENT: development
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    environment:
      ENVIRONMENT: development
    volumes:
      - ./backend/app:/app/app

  beat:
    environment:
      ENVIRONMENT: development
    volumes:
      - ./backend/app:/app/app

  frontend:
    ports:
      - "127.0.0.1:3005:3000"
    build:
      context: ./client
      target: deps
    volumes:
      - ./client/app:/app/app
      - ./client/components:/app/components
      - ./client/lib:/app/lib
      - ./client/public:/app/public
      - ./client/next.config.ts:/app/next.config.ts
      - ./client/tsconfig.json:/app/tsconfig.json
      - ./client/postcss.config.mjs:/app/postcss.config.mjs
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
