# Production overlay. Deploy with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# ONLY the frontend is published, to loopback, behind the host nginx that
# terminates TLS (see deploy/nginx/recallai.conf). The backend is never exposed —
# it is reached only via the frontend's authenticated /api/proxy over the `web`
# network. Postgres + Redis sit on the internal `backend` network (no host route).
#
# `no-new-privileges` blocks setuid escalation on every service.
# NOTE (F7 follow-up): backend/worker/beat still run as root so they can write the
# RECALLAI_DATA_DIR bind mounts. To run non-root, chown the data subdirs to the
# container uid (or add a gosu entrypoint), then add `cap_drop: [ALL]`.

services:
  frontend:
    ports:
      - "127.0.0.1:3005:3000"   # nginx proxies to this host port
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  worker:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  beat:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
