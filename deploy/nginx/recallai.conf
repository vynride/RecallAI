# RecallAI — nginx reverse proxy (Debian host).
#
# Only the Next.js frontend is exposed. It proxies API calls to the backend over
# the internal Docker network, so nginx only needs the single frontend upstream
# published on 127.0.0.1:3005 (see docker-compose.prod.yml).
#
# Install:
#   sudo cp deploy/nginx/recallai.conf /etc/nginx/sites-available/recallai
#   sudo ln -s /etc/nginx/sites-available/recallai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS certs via certbot (webroot), e.g.:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d recall-ai.vynride.dev -d recallai.vynride.dev

# Per-client-IP request throttle (edge). Tune to taste.
limit_req_zone $binary_remote_addr zone=recallai:10m rate=20r/s;

# --- HTTP: ACME challenge + redirect to HTTPS ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name recall-ai.vynride.dev recallai.vynride.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: proxy everything to the frontend -------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recall-ai.vynride.dev recallai.vynride.dev;

    # One cert covers both names (certbot -d recall-ai.vynride.dev -d recallai.vynride.dev).
    ssl_certificate     /etc/letsencrypt/live/recall-ai.vynride.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recall-ai.vynride.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers at the edge (always, incl. error responses).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # A Content-Security-Policy is the strongest backstop for the BYOK key in
    # sessionStorage, but must be verified in-browser first (PDF <embed>, the
    # Umami script, framer-motion inline styles). Enable after testing:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://YOUR-UMAMI-HOST; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://YOUR-UMAMI-HOST; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;

    # PDF uploads: app cap is 50 MB; leave headroom for multipart overhead.
    client_max_body_size 55m;

    # SSE job-progress stream (and other API proxy calls): no buffering, long reads.
    location /api/proxy/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Everything else (pages, /api/auth, static) -> frontend.
    location / {
        limit_req zone=recallai burst=40 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
